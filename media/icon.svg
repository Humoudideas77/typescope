<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="heat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F44336;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="url(#bg)" />
  <!-- "TS" text -->
  <text x="64" y="55" text-anchor="middle" fill="#3178C6" font-family="monospace" font-size="28" font-weight="bold">TS</text>
  <!-- Heat bar -->
  <rect x="20" y="70" width="88" height="12" rx="6" fill="url(#heat)" />
  <!-- Scope circles -->
  <circle cx="64" cy="100" r="8" fill="none" stroke="#3178C6" stroke-width="2" />
  <circle cx="64" cy="100" r="16" fill="none" stroke="#3178C6" stroke-width="1.5" opacity="0.5" />
  <circle cx="64" cy="100" r="2" fill="#3178C6" />
</svg>
